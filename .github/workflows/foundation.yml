name: Ash IDE foundation

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    name: Source, types, CLI, and desktop bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CI: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      - name: Verify the pinned package manager
        run: test "$(pnpm --version)" = '12.14.0'
      - name: Install exactly the reviewed lockfile
        run: pnpm install --frozen-lockfile
      - name: Verify source attribution and adapted file hashes
        run: node config/scripts/provenance/verify-source-ledger.mjs
      - name: Build retained workspace packages
        run: node config/scripts/workspace-package-build/build-workspace-packages.mjs
      - name: Check TypeScript projects
        run: node config/scripts/typecheck/project-execution/run-typecheck-projects-in-parallel.mjs
      - name: Test the persistent runtime and provider boundaries
        run: |
          node config/scripts/test-runtime/execution-policy/run-vitest.mjs run \
            --config config/vitest.config.ts --pool=threads --maxWorkers=1 \
            --no-file-parallelism \
            src/main/ipc/runtime-environments/ash-local-environment-queries.test.ts \
            src/main/runtime/rpc/methods/terminal-daemon-stop.test.ts \
            src/cli/handlers/terminal-daemon-stop.test.ts \
            src/cli/handlers/runtime.test.ts \
            src/shared/rpc-contract/terminal-daemon-params.test.ts \
            src/shared/ash-runtime-capabilities.test.ts \
            src/main/startup/window-all-closed-quit-policy.test.ts \
            src/main/cli/ash-cli-isolation.test.ts \
            src/shared/agent-launch/catalog/ash-provider-isolation.test.ts \
            src/renderer/src/lib/quick-workspace-agent-selection.ash.test.ts \
            src/main/runtime/terminal/launch/ash-agent-teams-launch-disabled.test.ts \
            src/main/runtime/terminal/launch/ash-agent-account-env-snapshot.test.ts \
            src/main/runtime/terminal/launch/ash-claude-live-pane-adoption.test.ts \
            src/main/runtime/terminal/launch/ash-claude-degraded-status-launch.test.ts \
            src/main/runtime/terminal/launch/ash-claude-session-overlay-launch.test.ts \
            src/main/runtime/terminal/launch/ash-claude-session-overlay-recovery.test.ts \
            src/main/agent-hooks/session/claude-host-launch-correlation-consistency.test.ts \
            src/main/ipc/pty/runtime/committed-local-pty-spawn-evidence.test.ts \
            src/main/ipc/pty/runtime/claude-shell-entry-environment-witness.test.ts \
            src/main/ipc/pty/runtime/claude-session-profile-routing-pin.test.ts \
            src/main/ipc/pty/runtime/claude-session-profile-routing-pin.node-pty.test.ts \
            src/main/providers/local-pty/local-pty-executable-spawn.node-pty.test.ts \
            src/main/providers/local-pty/local-pty-post-dispatch-cancel.node-pty.test.ts \
            src/main/codex/configuration/homes/codex-pane-launch-account.test.ts \
            src/main/codex-accounts/ash-codex-account-selection-recovery.test.ts \
            src/main/agent-hooks/ash-shared-hook-disable.test.ts \
            src/main/agent-hooks/ash-provider-hook-callsite-gates.test.ts \
            src/main/agent-hooks/ownership/ash-hook-ownership-plan.test.ts \
            src/main/agent-hooks/ownership/ash-hook-ownership-store.test.ts \
            src/main/agent-hooks/ownership/ash-provider-json-guard.test.ts \
            src/main/agent-hooks/ownership/ash-provider-hook-transaction.test.ts \
            src/main/agent-hooks/ownership/ash-provider-hook-removal.test.ts \
            src/main/agent-hooks/ownership/ash-provider-hook-removal-negative.test.ts \
            src/main/agent-hooks/ownership/ash-provider-real-crash-recovery.test.ts \
            src/main/agent-hooks/session/ash-claude-session-settings.test.ts \
            src/main/orcad/ash-managed-provider-hook-startup.test.ts \
            src/main/providers/accounts/agent-auth-restart-preservation.test.ts \
            src/main/startup/ash-windows-installer-ownership.test.ts \
            src/main/runtime/rpc/methods/terminal/ash-agent-teams-rpc-disabled.test.ts
      # Native shell readiness in a PTY requires the Node fork worker here.
      # The Bun-driven node-runtime pool has no reliable shell data/exit events
      # for this fixture; keep the existing foundation suite on its pinned runner.
      - name: Test Claude runtime-controller native PTY routing
        run: |
          node node_modules/vitest/vitest.mjs run \
            --config config/vitest.config.ts --pool=forks --maxWorkers=1 \
            --no-file-parallelism \
            src/main/ipc/pty/runtime/claude-session-profile-routing-pin.runtime-controller.node-pty.test.ts
      - name: Test retained IPC registrations
        run: |
          node node_modules/vitest/vitest.mjs run \
            --config config/vitest.config.ts --pool=forks --maxWorkers=1 \
            --no-file-parallelism \
            src/main/ipc/source-control/github-pr-refresh-handlers.test.ts \
            src/main/ipc/rate-limits.test.ts \
            src/main/ipc/provider-native-skill-discovery.test.ts \
            src/main/ipc/skill-delete/ash-native-delete-ipc-transaction.test.ts \
            src/main/ipc/ash-excluded-skill-cloud-handlers.test.ts \
            src/main/startup/main-process-ready-duplicate-pty-repair.test.ts \
            src/main/ipc/ash-updater-status.test.ts \
            src/main/ipc/m8-local-only-report-ipc.test.ts \
            src/main/orcad/orcad-scheduled-automation-exclusion.test.ts \
            src/main/orcad/orcad-ash-local-only-network.test.ts \
            src/main/startup/ash-excluded-mobile-cloud-relay-startup.test.ts \
            src/main/runtime/rpc/server/ash-mobile-pairing-entrypoints-retirement.test.ts \
            src/main/runtime/rpc/server/ash-mobile-relay-provider-hooks-retirement.test.ts \
            src/main/runtime/mobile-desktop-relay/ash-retired-phone-relay-implementation.test.ts \
            src/main/runtime/mobile-cloud-relay/ash-retired-vendor-relay-session.test.ts \
            src/main/ipc/profiles/ash-excluded-cloud-org-admin.test.ts \
            src/main/startup/main-process-quit-update-veto.test.ts \
            src/main/startup/main-process-quit-pending-writer.test.ts \
            src/main/runtime/rpc/methods/ash-runtime-methods.test.ts \
            src/main/runtime/rpc/methods/ash-excluded-mobile-push-rpc.test.ts \
            src/main/runtime/push/ash-mobile-push-gateway-retirement.test.ts \
            src/main/runtime/rpc/ash-mobile-rpc-routing-retirement.test.ts \
            src/main/runtime/rpc/server/runtime-rpc-mobile-automations.test.ts \
            src/cli/runtime/serve-orcad-launch.test.ts \
            src/cli/excluded-scheduled-automation-registration.test.ts
      - name: Test runtime-scoped WebSocket authentication and legacy mobile rejection
        run: |
          node node_modules/vitest/vitest.mjs run \
            --config config/vitest.config.ts --pool=forks --maxWorkers=1 \
            --no-file-parallelism \
            src/main/runtime/rpc/server/runtime-rpc-mobile-method-allowlist.test.ts \
            src/main/runtime/rpc/server/runtime-rpc-mobile-unknown-method-scope-refusal.test.ts \
            src/main/runtime/rpc/server/runtime-rpc-mobile-legacy-socket-relay-refusal.test.ts \
            src/main/runtime/rpc/server/ash-mobile-websocket-auth-exclusion.test.ts \
            src/main/runtime/rpc/mobile-socket-wiring.test.ts \
            src/main/runtime/rpc/device-key-auth.test.ts \
            src/main/runtime/rpc/web-session-pairing.test.ts \
            src/main/runtime/rpc/server/runtime-rpc-device-revocation.test.ts \
            src/main/runtime/rpc/server/runtime-rpc-device-key-dispatch.test.ts \
            src/main/runtime/rpc/server/runtime-rpc-mobile-terminal-streaming.test.ts \
            src/main/runtime/rpc/methods/agent-launch-cwd-refusal.test.ts
      - name: Test excluded renderer startup capability gates
        run: |
          node node_modules/vitest/vitest.mjs run \
            --config config/vitest.config.ts --pool=forks --maxWorkers=1 \
            --no-file-parallelism \
            src/preload/ash-no-orca-feedback-surface.test.ts \
            src/preload/api/ash-excluded-skill-cloud-preload.test.ts \
            src/cli/ash-excluded-cloud-skill-publishing.test.ts \
            src/cli/handlers/skill-installed.test.ts \
            src/cli/handlers/skill-guide-host-gate.test.ts \
            src/main/runtime/rpc/methods/skills.test.ts \
            src/main/runtime/rpc/methods/publish-capability-settings.test.ts \
            src/main/runtime/integrations/skill/ash-excluded-internal-skill-cloud.test.ts \
            src/main/runtime/integrations/skill/ash-retired-cloud-skill-runtime-surface.test.ts \
            src/main/skills/ash-excluded-remote-cloud-skill-transfer.test.ts \
            src/main/skills/ash-retired-upload-staging-preservation.test.ts \
            src/renderer/src/app-shell/ash-excluded-startup-gates.test.tsx \
            src/renderer/src/app-shell/ash-excluded-automation-entrypoints.test.tsx \
            src/renderer/src/store/app-plugin-host-boundary.test.tsx \
            src/renderer/src/components/settings/updates/ash-unavailable-update-settings.test.tsx \
            src/renderer/src/components/sidebar/ash-help-menu-identity.test.tsx \
            src/renderer/src/components/settings/privacy/ash-local-only-privacy.test.tsx \
            src/renderer/src/components/terminal-pane/legacy-relay-bridge-panes-no-preload.test.ts \
            src/renderer/src/app-shell/ash-excluded-speech-entrypoints.test.ts \
            src/renderer/src/app-shell/ash-excluded-mobile-entrypoints.test.ts \
            src/renderer/src/app-shell/ash-excluded-orca-cloud-settings.test.tsx \
            src/renderer/src/components/skills/ash-excluded-cloud-skills-page.test.tsx \
            src/renderer/src/components/skills/ash-excluded-cloud-publishing-components.test.ts \
            src/renderer/src/components/skills/ash-excluded-cloud-install-components.test.ts \
            src/renderer/src/components/settings/general/ash-skills-shortcut-settings.test.tsx \
            src/renderer/src/i18n/ash-excluded-phone-locales.test.ts \
            src/renderer/src/web/preload-api/ash-no-product-telemetry.test.ts
      - name: Build the Ash CLI
        run: ORCA_CLI_BUILD_COMPILER=tsrs node config/scripts/cli-build/build-cli.mjs
      - name: Build the Electron desktop bundle
        run: node config/scripts/desktop-build/execution/run-electron-vite-build.mjs
